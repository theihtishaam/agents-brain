name: README metrics

on:
  workflow_dispatch:
  schedule:
    - cron: '17 10 * * *'

permissions:
  contents: write

concurrency:
  group: readme-metrics
  cancel-in-progress: false

jobs:
  refresh:
    if: github.event.repository.private == false
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Verify counting and refresh public statistics
        run: |
          node --test .github/scripts/refresh-readme-metrics.test.mjs
          node .github/scripts/refresh-readme-metrics.mjs
      - name: Commit updated statistics
        run: |
          git config user.name "theihtishaam"
          git config user.email "59793939+theihtishaam@users.noreply.github.com"
          git add README.md docs/STATS.md docs/npm-metrics.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "docs: refresh public package statistics"
          git push
