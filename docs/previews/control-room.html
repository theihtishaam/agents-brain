  state.doc=documents.findIndex(doc=>doc.project===state.project);
  state.page=documents[state.doc].page;
  state.inspect='run';state.inspectAt=null;state.isolated=false;
  events=exampleEvents(runs[id]);
  state.cursor=Math.min(2,events.length-1);
  state.phase=EVENT_MS*.46;state.topologyTime=400;
  render();
}
function setGraphFocus(id){
  state.inspect=id;state.isolated=true;
  refreshInspector();syncPlayback();mountedNetwork?.draw();
}
document.addEventListener('click',event=>{
  const node=event.target.closest('[data-view],[data-run],[data-mode],[data-pick],[data-event],[data-doc],[data-page],[data-action],[data-graph-pick]');if(!node||node.disabled)return;
  const data=node.dataset;
  if(data.view){goto(data.view);return;}if(data.run){selectRun(data.run);return;}
  if(data.mode){state.mode=data.mode;render();$('main').querySelector('[data-mode="'+data.mode+'"]')?.focus();return;}
  if(data.graphPick){setGraphFocus(data.graphPick);return;}
  if(data.pick){state.inspect=data.pick;refreshInspector();syncPlayback();mountedNetwork?.draw();$('main').querySelector('.tabbar [data-pick="'+data.pick+'"]')?.focus({preventScroll:true});return;}
  if(data.event!==undefined){seekEvent(Number(data.event));return;}
  if(data.doc!==undefined){state.doc=Number(data.doc);state.page=documents[state.doc].page;goto('knowledge');return;}
  if(data.page){state.page=Math.max(1,Math.min(documents[state.doc].pages,state.page+Number(data.page)));render();return;}
  switch(data.action){
    case 'playback':state.playing=!state.playing;state.inspectAt=null;refreshInspector();syncPlayback();break;
    case 'isolate':state.isolated=false;refreshInspector();syncPlayback();mountedNetwork?.draw();$('graph-'+state.inspect)?.focus({preventScroll:true});break;
    case 'queue':state.received[state.project]=true;render();break;
    case 'approve':state.reviewed=true;render();break;
    case 'source-context':state.inspect='receipt';state.inspectAt=null;goto('overview');break;
    case 'note':{const note=$('note').value.trim();if(note){state.notes.push(note);render();$('note').focus();}break;}
    case 'evaluate':state.lesson='evaluated';render();break;
    case 'promote':state.lesson='promoted';render();break;
    case 'rollback':state.lesson='reverted';render();break;
    case 'setup':state.setup=true;render();break;
    case 'feature':state.feature=!state.feature;render();break;
  }
});
document.addEventListener('input',event=>{if(event.target.id==='replay-range')seekEvent(Number(event.target.value));});
$('project').addEventListener('change',event=>selectRun(event.target.value==='import'?'recovery':'checkout'));
render();
</script>
</body>
</html>
